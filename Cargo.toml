# The Rust workspace of Pier.
#
# This file and the root `xmake.lua` are two independent build lines, each owning
# one half:
#
#   xmake.lua   -> the host itself (pier.dll), the eight C++ packages
#   Cargo.toml  -> the binding for one language (pier-sys-rs -> pier-rs), and the
#                  example mod
#
# There is no build dependency between the two lines, only a contract dependency.
# The Rust side reads the single header packages/pier-abi/include/sdk/abi.h, and it
# reads it through a hand-written mirror in `pier-sys-rs`, whose consistency the
# `sys-mirrors-abi` check guards.
#
# A host that does not compile and a binding that does not compile are therefore two
# independent facts that can be fixed separately, which is the practical consequence
# of contract §0, that pier-abi is the product and everything else is one
# implementation of it.
#
# The `-rs` suffix in a package name states which ABI the binding is for. The crate
# names under `[lib] name` stay `levilamina` and `levilamina_sys`, matching the
# caller's mental model (contract §7).
[workspace]
resolver = "2"
members = [
    "bindings/rust/pier-sys-rs",
    "bindings/rust/pier-rs",
    "examples/hello-pier",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"

[profile.release]
lto = "thin"
