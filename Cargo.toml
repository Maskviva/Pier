# Pier 的 Rust 工作区。
#
# 这里和根 `xmake.lua` 是**两条独立的构建线**，各管一半：
#
#   xmake.lua   → 宿主本体（pier.dll），C++ 的八个包
#   Cargo.toml  → 一门语言的绑定（pier-sys-rs → pier-rs），以及示例模组
#
# 两条线之间**没有构建依赖**，只有契约依赖：Rust 侧读的是
# `packages/pier-abi/include/sdk/abi.h` 那一份头文件，读法是手写镜像
# （`pier-sys-rs`），一致性由 `sys-mirrors-abi` 机检守着。
#
# 所以「宿主编不过」和「绑定编不过」是两件独立的事，可以分别修 ——
# 这正是契约 §〇「pier-abi 是产品，其它都是它的一个实现」的实际后果。
#
# 包名带 `-rs` 后缀标明这是哪条 ABI 的绑定；crate 名（`[lib] name`）保持
# `levilamina` / `levilamina_sys`，贴着调用方的心智模型（契约 §七）。
[workspace]
resolver = "2"
members = [
    "packages/pier-sys-rs",
    "packages/pier-rs",
    "examples/hello-pier",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"

[profile.release]
lto = "thin"
