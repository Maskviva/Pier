name: Prime the xmake cache

# Run this by hand once, and again whenever xmake.lua or a package xmake.lua changes
# the cache key.
#
# Why it exists: installing the levilamina package copies roughly 20,000 header files,
# and on a Windows runner that is slow enough to exceed the timeout of a normal build
# job. actions/cache only saves at the end of a successful job, so a job that times out
# can never populate the cache that would have made it fast. That is a deadlock, and
# this job breaks it by doing the install once with a timeout long enough to finish and
# saving the result explicitly.
#
# It configures only. Compiling is not needed to populate the package cache, and
# leaving it out keeps this job as short as the install allows.

on:
  workflow_dispatch:

jobs:
  prime:
    name: Prime the ${{ matrix.target_type }} cache
    runs-on: windows-2022
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        target_type: [server, client]

    steps:
      - uses: actions/checkout@v7

      - uses: xmake-io/github-action-setup-xmake@v1

      # See build.yml for why this is pinned. This job's entire purpose is to run the
      # install that build.yml's timeout is too short for, so if the install itself
      # fails to compile, priming the cache fails the same way the job it primes for
      # would.
      - name: Install LLVM 21.1.8
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # The `clang+llvm-` archive carries LLVM's own libraries and tools on top of
          # the toolchain, which is what makes it 900 MB and tens of thousands of files:
          # a plain `tar -xf` of it took over ten minutes on a Windows runner. The `LLVM-`
          # installer is the toolchain alone, a fifth of the size, and NSIS's own silent
          # install is faster than shelling out to bsdtar for that many small files.
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-21.1.8/LLVM-21.1.8-win64.exe"
          curl.exe -fL --retry 3 -o "$env:RUNNER_TEMP\llvm-installer.exe" $url
          # /D sets the install directory and NSIS requires it unquoted, backslash-only,
          # with no trailing slash, and last on the command line.
          Start-Process -FilePath "$env:RUNNER_TEMP\llvm-installer.exe" `
              -ArgumentList "/S", "/D=C:\llvm" -Wait -NoNewWindow
          "C:\llvm\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Show the clang-cl that will be used
        shell: pwsh
        run: clang-cl --version

      - run: xmake repo -u

      # Restore first: a re-run after a partial failure then only installs what is
      # still missing rather than starting over.
      - uses: actions/cache/restore@v6
        with:
          path: ~/AppData/Local/.xmake/packages
          key: xmake-${{ matrix.target_type }}-${{ hashFiles('xmake.lua', 'packages/*/xmake.lua') }}
          restore-keys: xmake-${{ matrix.target_type }}-

      - run: xmake f -a x64 -m release -p windows --target_type=${{ matrix.target_type }} -y -v

      - name: Report what was installed
        run: xmake require --list

      - uses: actions/cache/save@v6
        with:
          path: ~/AppData/Local/.xmake/packages
          key: xmake-${{ matrix.target_type }}-${{ hashFiles('xmake.lua', 'packages/*/xmake.lua') }}
