name: Build

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  host:
    name: Build the ${{ matrix.target_type }} host
    # Pinned rather than windows-latest: that label moved to Visual Studio 2026 in
    # June 2026, no precompiled LeviLamina matches that toolset, and the job falls back
    # to compiling LeviLamina from source. A LeviLamina mod also has to be built with a
    # toolset ABI-compatible with BDS, so this pin is correctness and not just speed.
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target_type: [server, client]

    steps:
      - uses: actions/checkout@v7

      - uses: xmake-io/github-action-setup-xmake@v1

      # LeviLamina pins its own build to clang-cl (its xmake.lua line 41) and 26.32.0
      # does not compile under the Clang 20.1.8 the runner image ships:
      # MinecraftCommands.h holds unique_ptr members of four forward-declared types
      # (Command, CommandOutputSender, CommandRegistry, DeferredCommandBase) beside a
      # defaulted destructor, which Clang 20 instantiates at the class definition and
      # rejects, and Clang 21 does not. The same commit (31d23a0c) builds clean under
      # 21.1.8 with the same MSVC STL (14.44.35207), confirmed locally before this was
      # added. Filed upstream; this pin can go once LeviLamina fixes the header or the
      # runner image ships a newer Clang.
      - name: Install LLVM 21.1.8
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # The `clang+llvm-` archive carries LLVM's own libraries and tools on top of
          # the toolchain, which is what makes it 900 MB and tens of thousands of files:
          # a plain `tar -xf` of it took over ten minutes on a Windows runner. The `LLVM-`
          # installer is the toolchain alone, a fifth of the size, and NSIS's own silent
          # install is faster than shelling out to bsdtar for that many small files.
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-21.1.8/LLVM-21.1.8-win64.exe"
          curl.exe -fL --retry 3 -o "$env:RUNNER_TEMP\llvm-installer.exe" $url
          # /D sets the install directory and NSIS requires it unquoted, backslash-only,
          # with no trailing slash, and last on the command line.
          Start-Process -FilePath "$env:RUNNER_TEMP\llvm-installer.exe" `
              -ArgumentList "/S", "/D=C:\llvm" -Wait -NoNewWindow
          # Prepended, so this wins over the C:\Program Files\LLVM the image installs.
          "C:\llvm\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Show the clang-cl that will be used
        shell: pwsh
        run: clang-cl --version

      - run: xmake repo -u

      - uses: actions/cache@v6
        with:
          path: ~/AppData/Local/.xmake/packages
          key: xmake-${{ matrix.target_type }}-${{ hashFiles('xmake.lua', 'packages/*/xmake.lua') }}
          restore-keys: xmake-${{ matrix.target_type }}-

      # The modpacker reads git for a version number at the packaging stage, so a
      # checkout without tags packages as a bare commit hash.
      - run: git fetch --tags --force

      - run: xmake f -a x64 -m release -p windows --target_type=${{ matrix.target_type }} -v -y

      - run: xmake -v -y

      - uses: actions/upload-artifact@v7
        with:
          name: pier-${{ matrix.target_type }}-${{ github.sha }}-windows-x64
          path: bin/

  contract:
    name: Contract checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The machine checks of contract §9. They find what neither the compiler nor
      # clippy can: a slot order that drifted from the ABI, a package that dropped a
      # self-registering TU, a comment that lies about the code. Each states what it
      # covers and what it cannot see.
      - run: python3 tools/run-checks.py

      # The ledger of MIGRATION.md, counted from the table body rather than trusted.
      - run: python3 tools/ledger-count.py

  bindings:
    name: Build and test the Rust bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check

      - run: cargo clippy --workspace --all-targets -- -D warnings

      - run: cargo build --workspace --verbose

      - run: cargo test --workspace --verbose
