name: Docs

# The documentation site on GitHub Pages, published with every release, so the site always
# describes the version people can download. Run it by hand from the Actions tab to publish
# between releases.
#
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and a running one is never cancelled halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    # A project site lives under /<repository>/, so the language switcher and the canonical
    # URLs have to name it. With a custom domain set in Settings > Pages, set the repository
    # variables DOCS_SITE_URL, DOCS_LINK_EN and DOCS_LINK_ZH to that domain instead.
    env:
      DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
      DOCS_LINK_EN: ${{ vars.DOCS_LINK_EN || format('/{0}/', github.event.repository.name) }}
      DOCS_LINK_ZH: ${{ vars.DOCS_LINK_ZH || format('/{0}/zh/', github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - uses: actions/configure-pages@v5

      - name: Install
        run: pip install -r docs/requirements.txt

      # Run from docs/, so that `site_dir: ../site` and `../site/zh` land in <root>/site the
      # way the two configs write them. The English site goes first: a build wipes its whole
      # site_dir, so building it after the Chinese one would delete site/zh.
      - name: Build the English site
        working-directory: docs
        run: mkdocs build --strict --config-file mkdocs.yml

      - name: Build the Chinese site
        working-directory: docs
        run: mkdocs build --strict --config-file mkdocs.zh.yml

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
