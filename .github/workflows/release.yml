name: Release

on:
  release:
    types:
      - published

jobs:
  build:
    name: Build the ${{ matrix.target_type }} host
    # Pinned rather than windows-latest: that label moved to Visual Studio 2026 in
    # June 2026, no precompiled LeviLamina matches that toolset, and the job falls back
    # to compiling LeviLamina from source. A LeviLamina mod also has to be built with a
    # toolset ABI-compatible with BDS, so this pin is correctness and not just speed.
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target_type: [server, client]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: xmake-io/github-action-setup-xmake@v1

      - uses: actions/cache@v6
        with:
          path: ~/AppData/Local/.xmake
          key: xmake-release-${{ matrix.target_type }}-${{ hashFiles('xmake.lua', 'packages/*/xmake.lua') }}
          restore-keys: xmake-release-${{ matrix.target_type }}-

      - run: xmake repo -u

      # modpacker copies manifest.json into the package as it is, so the field has to
      # say which target this archive is for. Installing a client archive on a server
      # is refused during the handshake, on bit 0 of mod_flags, but the manifest should
      # not claim otherwise in the first place.
      - name: Set the manifest platform
        shell: pwsh
        run: |
          $m = Get-Content manifest.json -Raw | ConvertFrom-Json
          $m.platform = '${{ matrix.target_type }}'
          $m | ConvertTo-Json -Depth 10 | Set-Content manifest.json -Encoding utf8

      - run: xmake f -a x64 -m release -p windows --target_type=${{ matrix.target_type }} -y

      - run: xmake -w -y

      - shell: pwsh
        run: Get-ChildItem -Recurse bin

      - uses: actions/upload-artifact@v7
        with:
          name: pier-${{ matrix.target_type }}-${{ github.sha }}-windows-x64
          path: bin/

  release-notes:
    name: Extract release notes
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - id: notes
        uses: ffurrer2/extract-release-notes@v3

      - uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.release_notes }}

  upload:
    name: Upload the archives
    needs:
      - build
      - release-notes
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: pier-server-${{ github.sha }}-windows-x64
          path: server

      - uses: actions/download-artifact@v7
        with:
          name: pier-client-${{ github.sha }}-windows-x64
          path: client

      # lip places the archive contents directly into plugins/pier/, so each archive
      # has to be flat: no wrapping bin/ or pier/ directory.
      - name: Flatten and archive
        shell: bash
        run: |
          for t in server client; do
            cp LICENSE README.md "$t/"
            if [ -d "$t/pier" ]; then mv "$t"/pier/* "$t/" && rmdir "$t/pier"; fi
            if [ -d "$t/bin" ];  then mv "$t"/bin/*  "$t/" && rmdir "$t/bin";  fi
            echo "--- $t"
            find "$t"
            ( cd "$t" && zip -r "../pier-$t-windows-x64.zip" . )
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            pier-server-windows-x64.zip
            pier-client-windows-x64.zip
