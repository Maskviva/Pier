[package]
name = "pier-rs"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
description = "Writing LeviLamina mods in safe Rust. Pier ABI v1 / BDS 1.26.20 / LeviLamina 26.20.4."
readme = "../../../README.md"
repository = "https://github.com/Maskviva/Pier"
keywords = ["levilamina", "minecraft", "bedrock", "mod", "bds"]
categories = ["game-development", "api-bindings"]

[package.metadata.minecraft]
bds_version = "1.26.20"
levilamina_version = "26.20.4"
abi_version = 1
lane_protocol = 1

# See pier-sys-rs: the package name changed and the crate name did not, since
# `use levilamina::` is the mental model of a mod.
[lib]
name = "levilamina"
path = "src/lib.rs"

[dependencies]
# service::exists() used to substring-match inside JSON text, the same class of mistake
# contract §6 forbids, only on the other side. It really parses now.
# The typed service calls, call_json and register_json, need the serde traits. The derive
# is optional and business code enables it itself.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pier-sys-rs = { version = "26.20.1", path = "../pier-sys-rs", default-features = false }

# One feature remains and it changes no layout.
#
# There used to be `server`, `client` and `more_dimensions`, where the first two were
# mutually exclusive and the third added and removed fields of `PierApi`. From ABI v1 that
# whole arrangement is void:
#
#   * the layout is identical on every target (contract §2.1), leaving no room for a
#     dimension feature, since the dimension capability is decided at runtime by
#     `md_is_available()` and an empty slot;
#   * `server` and `client` no longer trim the API surface mutually exclusively. The
#     client-only group of slots is simply NULL on a server host, and calling one gives an
#     Err saying the host does not provide it rather than a compile error.
#
# The only purpose of keeping `client` is to have `register_mod!` set bit 0 in the
# `mod_flags` of the vtable, on which the host refuses a mod loaded onto the wrong target.
# It adds and removes no API at all.
[features]
default = []
client = ["pier-sys-rs/client"]
