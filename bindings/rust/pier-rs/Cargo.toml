[package]
name = "pier-rs"
version = "2.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Writing LeviLamina mods in safe Rust. Pier ABI v2 / BDS 1.26.51 / LeviLamina 26.51.5."
readme = "../../../README.md"
repository = "https://github.com/Maskviva/Pier"
keywords = ["levilamina", "minecraft", "bedrock", "mod", "bds"]
categories = ["game-development", "api-bindings"]

[package.metadata.minecraft]
bds_version = "1.26.51"
levilamina_version = "26.51.5"
abi_version = 2
lane_protocol = 1

# See pier-sys-rs: the package name changed and the crate name did not, since
# `use levilamina::` is the mental model of a mod.
[lib]
name = "levilamina"
path = "src/lib.rs"

[dependencies]
# service::exists() used to substring-match inside JSON text, the same class of mistake
# contract §6 forbids, only on the other side. It really parses now.
# The typed service calls, call_json and register_json, need the serde traits. The derive
# is optional and business code enables it itself.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pier-sys-rs = { version = "26.51.2", path = "../pier-sys-rs", default-features = false }

# One feature, `client`, and it changes no layout: it makes `register_mod!` set bit 0 of the
# vtable's `mod_flags`, on which the host refuses a mod loaded onto the wrong target. The
# layout is the same on every target (contract §2.1): a client-only slot is NULL on a server
# host and calling it returns an Err, and the dimension capability is decided at runtime.
[features]
default = []
client = ["pier-sys-rs/client"]
