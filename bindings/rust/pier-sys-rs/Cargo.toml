[package]
name = "pier-sys-rs"
version = "26.20.1"
edition = "2021"
license = "Apache-2.0"
description = "Raw FFI declarations for Pier, cell for cell against packages/pier-abi/include/sdk/abi.h (ABI v1)."
readme = "../../../README.md"
repository = "https://github.com/Maskviva/Pier"
keywords = ["levilamina", "minecraft", "bedrock", "ffi"]
categories = ["external-ffi-bindings", "game-development"]

# The package is named pier-sys-rs while the crate name stays levilamina_sys
# (contract §7). The package name answers which ABI it belongs to and the crate name
# follows the caller's mental model: a mod author writes LeviLamina business code and Pier
# is only the gangway carrying it across. `use levilamina_sys::` therefore keeps working.
[lib]
name = "levilamina_sys"
path = "src/lib.rs"

[dependencies]

# On features: from v1 onward these are build-time target declarations only and affect no
# layout.
#
# Features that change the field set of PierApi are what caused the seven-slot
# misalignment: the macro was defined by nobody on the host side while the cfg was always
# true in the mirror, the two tables had different lengths, and the tail shifted whole.
#
# The layout of ABI v1 is identical on every target (contract §2.1) and an absent
# capability is a NULL slot. Therefore:
#
#   * no feature selects a dimension capability. It is decided at runtime through
#     `md_is_available()` and an empty slot, never at compile time;
#   * `client` remains and decides only that one bit in `PierModVTable::mod_flags`,
#     adding and removing no field. The host compares target through flags bit 0 and
#     refuses to load explicitly on a mismatch.
#
# The `sys-mirrors-abi` check refuses any `#[cfg]` in this crate, tests aside, so that the
# paragraph above stays true rather than remaining a wish.
[features]
default = []
client = []
