[package]
name = "pier-sys-rs"
version = "26.51.2"
edition = "2021"
license = "Apache-2.0"
description = "Raw FFI declarations for Pier, cell for cell against packages/pier-abi/include/sdk/abi.h (ABI v2)."
readme = "../../../README.md"
repository = "https://github.com/Maskviva/Pier"
keywords = ["levilamina", "minecraft", "bedrock", "ffi"]
categories = ["external-ffi-bindings", "game-development"]

# The package is named pier-sys-rs while the crate name stays levilamina_sys
# (contract §7). The package name answers which ABI it belongs to and the crate name
# follows the caller's mental model: a mod author writes LeviLamina business code and Pier
# is only the gangway carrying it across. `use levilamina_sys::` therefore keeps working.
[lib]
name = "levilamina_sys"
path = "src/lib.rs"

[dependencies]

# On features: from v1 onward these are build-time target declarations only and affect no
# layout.
#
# The layout of ABI v2 is identical on every target (contract §2.1) and an absent
# capability is a NULL slot, so no feature changes a field of PierApi: the dimension
# capability is decided at runtime. `client` changes nothing in this crate; it is kept
# because pier-rs forwards its own `client` feature here and a feature is public surface
# (contract §2.5). The `sys-mirrors-abi` check refuses any `#[cfg]` in this crate, tests
# aside.
[features]
default = []
client = []
