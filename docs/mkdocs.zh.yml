# 中文站点。英文站点是 mkdocs.yml，构建到 site/；页头的语言切换器连接两者。
site_name: Pier
site_description: 用 Rust、C++、Go、Zig 写 LeviLamina 模组
# Where the site is published, which is what the canonical links and sitemap.xml name. The
# Docs workflow sets DOCS_SITE_URL from the repository; the default is this project's site.
site_url: !ENV [DOCS_SITE_URL, "https://maskviva.github.io/Pier/"]
repo_url: https://github.com/Maskviva/pier
repo_name: Maskviva/pier
edit_uri: edit/main/docs/zh/
docs_dir: zh
site_dir: ../site/zh

theme:
  name: material
  custom_dir: overrides
  language: zh
  icon:
    logo: material/anchor
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: custom
      toggle:
        icon: material/brightness-7
        name: 切换到暗色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: custom
      toggle:
        icon: material/brightness-4
        name: 切换到亮色模式
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.select
    - content.tabs.link

plugins:
  - search:
      lang: zh
      separator: '[\s\u200b\-]'

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      auto_title: true
      linenums: true
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - assets/stylesheets/pier.css

extra:
  alternate:
    - name: English
      link: !ENV [DOCS_LINK_EN, "/"]
      lang: en
    - name: 中文
      link: !ENV [DOCS_LINK_ZH, "/zh/"]
      lang: zh
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Maskviva/pier

# Links into a page are checked down to the heading they name, so a renamed interface
# fails the --strict build instead of leaving a link that lands at the top of the page.
validation:
  anchors: warn

