# The English site. The Chinese site is mkdocs.zh.yml, built into site/zh; the language
# selector in the header links the two.
site_name: Pier
site_description: LeviLamina mods in Rust, C++, Go and Zig
repo_url: https://github.com/Maskviva/pier
repo_name: Maskviva/pier
edit_uri: edit/main/docs/en/
docs_dir: en
site_dir: ../site
exclude_docs: |
  verify-delayload.md

theme:
  name: material
  custom_dir: overrides
  language: en
  icon:
    logo: material/anchor
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.select
    - content.tabs.link

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      auto_title: true
      linenums: true
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - assets/stylesheets/pier.css

extra:
  alternate:
    - name: English
      link: !ENV [DOCS_LINK_EN, "/"]
      lang: en
    - name: 中文
      link: !ENV [DOCS_LINK_ZH, "/zh/"]
      lang: zh
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Maskviva/pier

# Links into a page are checked down to the heading they name, so a renamed interface
# fails the --strict build instead of leaving a link that lands at the top of the page.
validation:
  anchors: warn

