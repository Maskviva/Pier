[package]
name = "pier-rs"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
description = "用安全 Rust 写 LeviLamina 模组。Pier ABI v1 / BDS 1.26.20 / LeviLamina 26.20.4。"
readme = "../../README.md"
keywords = ["levilamina", "minecraft", "bedrock", "mod", "bds"]
categories = ["game-development", "api-bindings"]

[package.metadata.minecraft]
bds_version = "1.26.20"
levilamina_version = "26.20.4"
abi_version = 1
lane_protocol = 1

# 见 pier-sys-rs：包名换了，crate 名不换 —— `use levilamina::` 是模组的心智模型。
[lib]
name = "levilamina"
path = "src/lib.rs"

[dependencies]
# service::exists() 曾经在 JSON 文本里做子串匹配 —— 和契约 §六 禁的是同一类
# 错误，只是发生在另一侧。改成真解析。
# service 的类型化调用（call_json / register_json）要 serde 的 trait；
# derive 是可选的，业务侧自己开。
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pier-sys-rs = { version = "1.0.0", path = "../pier-sys-rs", default-features = false }

# ── feature 只剩一个，而且它不改任何布局 ──────────────────────────
#
# v0 有 `server` / `client` / `more_dimensions` 三个，其中前两个互斥、第三个
# 会往 `PierApi` 里增删字段。ABI v1 之后这套全部作废：
#
#   * 布局在所有目标下相同（契约 §2.1），`more_dimensions` 没有存在的余地 ——
#     维度能力改由**运行期**的 `md_is_available()` 与空槽判断；
#   * `server` / `client` 不再互斥地裁剪 API 面。客户端专属的那组槽在服务端
#     宿主上就是 NULL，调用它会得到一个「宿主不提供」的 Err，而不是编译错误。
#
# 保留 `client` 的唯一作用是让 `register_mod!` 往 vtable 的 `mod_flags` 里
# 填上 bit 0，宿主据此拒绝装错目标的模组。它**一个 API 都不增删**。
[features]
default = []
client = ["pier-sys-rs/client"]
